name: 活跃市值数据 · 定时抓取

# 抓取 zgnb.top 活跃市值日 K 的最新值 → docs/amv_live.json
# 页面端每 5 分钟读一次这个 JSON；本工作流负责让它保持新鲜。
#
# ⚠️ 凭据：仓库 Secrets → ZGNB_TOKEN（zgnb.top 登录后 localStorage 的 stock.auth.token）。
#    未配置时脚本会写 ok:false 并稳定退出，页面显示「读取失败：未配置 ZGNB_TOKEN」。
#
# ⚠️ 数据与日报主工作流（daily.yml）互不改同一文件；push 前仍做 pull --rebase，
#    避免用户手动点「刷新日报」与本任务并发时撞车。

on:
  schedule:
    - cron: '0,30 1-8 * * 1-5'   # UTC 01:00~08:30 = 北京 09:00~16:30，每 30 分钟
  workflow_dispatch:            # 也可在 Actions 页手动点一次立即抓

concurrency:
  group: amv-live
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 抓取活跃市值并写入 JSON
        env:
          ZGNB_TOKEN: ${{ secrets.ZGNB_TOKEN }}
        run: python fetch_amv.py --out docs/amv_live.json

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/amv_live.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 活跃市值数据更新"
          git pull --rebase origin main
          git push origin main
