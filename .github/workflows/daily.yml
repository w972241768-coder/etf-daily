name: ETF 轮动日报 · 手动刷新

# 免费额度：公开仓库 Actions 分钟数不计量；GitHub Pages 静态托管免费。
#
# ⚠️ GitHub 的 schedule 是「尽力而为」调度：高负载时会延后十几分钟，也可能整次丢弃
#    （2026-10-26 实测：04:30 UTC 那次首跑被直接跳过，仓库里 12 次运行全是手动）。
#
# ★★ 2026-11-03 用户拍板：**停用全部定时自动更新**，只保留手动触发。
#    触发方式 = 日报页面右下角「🔄 刷新日报」按钮 → GitHub API 调 workflow_dispatch
#    （REPO=w972241768-coder/etf-daily，WF=daily.yml，REF=main，见 etf_rotation.py 的 rfRun）。
#    停用理由：
#      ① 用户已固定用手动刷新，觉得时机自己掌控、更及时；
#      ② 自动跑每天最多 3 次会在 docs/ 产生提交，与本地手动跑互相 rebase 打架
#         （2026-11-03 已因 CI 抢推导致一次 push 被 rejected）。
#    要恢复定时：把下面 schedule 三行的注释去掉即可，其余逻辑无需改动。

on:
  # schedule:
  #   - cron: "20 4 * * 1-5"      # 时段一 UTC 04:20 = 北京 12:20
  #   - cron: "50 4 * * 1-5"      # 时段二 UTC 04:50 = 北京 12:50
  #   - cron: "45 7 * * 1-5"      # 时段三 UTC 07:45 = 北京 15:45（收盘后）
  workflow_dispatch:            # ← 页面「刷新日报」按钮走这条；也可在 Actions 页手动点

# 同一时间只允许一个实例，避免多次运行同时 push 到 main 造成冲突
concurrency:
  group: etf-daily-report
  cancel-in-progress: false

permissions:
  contents: write             # 需要写权限才能把生成的 HTML 提交回仓库

jobs:
# ⚠️ 2026-11-03：原 jobs.gate（时间窗判重）已删除。
#   它的唯一作用是「同一时段内已有提交就跳过」，而判重的前提是多个 schedule 并发触发；
#   现在只剩手动触发，用户点一次就跑一次，判重反而会误挡（同一天刷第二次会被跳过）。
#   如需恢复定时，记得连 gate job 一起从 git 历史取回。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          # ⚠ 必须 >= 3.12：numpy 2.5.x 的 requires_python 是 >=3.12，
          # 用 3.11 会 pip 报 "No matching distribution found for numpy==2.5.2" 秒挂。
          # 与本地验证环境（Python 3.13）保持一致。
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 固定版本，与本地验证过的完全一致（Python 3.13 + pandas 2.3.3 + numpy 2.5.2）。
          # 不锁 pandas 3.0：其 idxmax 对全 NA 行的破坏性变更已在源码层修正，见下方说明。
          pip install "pandas==2.3.3" "numpy==2.5.2"
          python -c "import sys,pandas,numpy;print('ENV OK',sys.version.split()[0],'pandas',pandas.__version__,'numpy',numpy.__version__)"

      - name: 生成日报
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MPLBACKEND: "Agg"
          TZ: Asia/Shanghai
        run: |
          mkdir -p docs
          python etf_rotation.py --no-open --out docs/index.html --state-out docs/state.json
          touch docs/.nojekyll
          echo "--- 产物 ---"
          ls -lh docs/

      - name: 状态切换提醒（不换仓不打扰）
        # ⚠️ 必须排在「提交」之前：notify.py 用 `git show HEAD:docs/state.json`
        #    读上一版快照，此时 HEAD 还指向上一次提交。
        # 任何推送失败都只打印、不退出 1 —— 提醒坏了不能让日报的提交也被跳过。
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python notify.py --state docs/state.json || echo "::warning::提醒步骤失败，日报不受影响"

      - name: 提交并推送（Pages 自动更新）
        run: |
          git config user.name  "etf-daily-bot"
          git config user.email "etf-daily-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 日报 $(TZ=Asia/Shanghai date +%F) $(TZ=Asia/Shanghai date +%H:%M) CST"
            git push
          fi
      # 生成失败时本步报错终止，docs/index.html 保持上一版 → Pages 继续显示上一份可用报告



