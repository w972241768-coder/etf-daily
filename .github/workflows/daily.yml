name: ETF 轮动日报 · 每日生成

# 免费额度：公开仓库 Actions 分钟数不计量；GitHub Pages 静态托管免费。
#
# ⚠️ GitHub 的 schedule 是「尽力而为」调度：高负载时会延后十几分钟，也可能整次丢弃
#    （2026-10-26 实测：04:30 UTC 那次首跑被直接跳过，仓库里 12 次运行全是手动）。
#    因此设三个时段冗余，均在南非 10:00 之前完成：
#      时段一  UTC 04:20 = 北京 12:20 = 南非 06:20
#      时段二  UTC 04:50 = 北京 12:50 = 南非 06:50
#      时段三  UTC 07:45 = 北京 15:45 = 南非 09:45（收盘后，用收盘数据）
#    三个时段都走 jobs.gate 判重：只有当天首次运行才会真正提交，
#    其他时段发现已生成日报就跳过——正常情况下每天只提交一次。
# 交易日：时段一/时段二为盘中价（新浪快照补末根）；时段三为收盘数据。
# 周末/非交易日：均为上一交易日收盘。

on:
  schedule:
    - cron: "20 4 * * 1-5"      # 时段一（南非 06:20）
    - cron: "50 4 * * 1-5"      # 时段二（南非 06:50）——时段一被跳过时兜底
    - cron: "45 7 * * 1-5"      # 时段三（南非 09:45）——盘中时段再兜底，用收盘数据
  workflow_dispatch:            # 也可在 Actions 页手动点一次立刻跑

# 同一时间只允许一个实例，避免多次运行同时 push 到 main 造成冲突
concurrency:
  group: etf-daily-report
  cancel-in-progress: false

permissions:
  contents: write             # 需要写权限才能把生成的 HTML 提交回仓库

jobs:
# 判重闸门：所有 schedule 触发都先检查「北京时间当天是否已有日报提交」，
# 已有则 skip=1（跳过构建），无则放行。
# 效果：每天只真正执行一次 build——
#   时段一跑挂（无提交）→ 时段二/三依次兜底；
#   任一时段成功提交 → 其余时段自动跳过。
# 手动触发一律放行（skip=0）。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50        # 需要历史才能查到 docs/state.json 上次提交时间
      - id: chk
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "手动触发，直接执行"
            exit 0
          fi
          today_start=$(TZ=Asia/Shanghai date -d 'today 00:00' +%s)
          last=$(git log -1 --format=%ct -- docs/state.json 2>/dev/null || echo 0)
          echo "state.json 上次提交时间戳=$last　今日零点=$today_start"
          if [ "$last" -ge "$today_start" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::北京时间当天已有日报提交（上次 $last），跳过本次：$SCHEDULE"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
            echo "今日尚无日报，执行本次：$SCHEDULE"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          # ⚠ 必须 >= 3.12：numpy 2.5.x 的 requires_python 是 >=3.12，
          # 用 3.11 会 pip 报 "No matching distribution found for numpy==2.5.2" 秒挂。
          # 与本地验证环境（Python 3.13）保持一致。
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 固定版本，与本地验证过的完全一致（Python 3.13 + pandas 2.3.3 + numpy 2.5.2）。
          # 不锁 pandas 3.0：其 idxmax 对全 NA 行的破坏性变更已在源码层修正，见下方说明。
          pip install "pandas==2.3.3" "numpy==2.5.2"
          python -c "import sys,pandas,numpy;print('ENV OK',sys.version.split()[0],'pandas',pandas.__version__,'numpy',numpy.__version__)"

      - name: 生成日报
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MPLBACKEND: "Agg"
          TZ: Asia/Shanghai
        run: |
          mkdir -p docs
          python etf_rotation.py --no-open --out docs/index.html --state-out docs/state.json
          touch docs/.nojekyll
          echo "--- 产物 ---"
          ls -lh docs/

      - name: 状态切换提醒（不换仓不打扰）
        # ⚠️ 必须排在「提交」之前：notify.py 用 `git show HEAD:docs/state.json`
        #    读上一版快照，此时 HEAD 还指向上一次提交。
        # 任何推送失败都只打印、不退出 1 —— 提醒坏了不能让日报的提交也被跳过。
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python notify.py --state docs/state.json || echo "::warning::提醒步骤失败，日报不受影响"

      - name: 提交并推送（Pages 自动更新）
        run: |
          git config user.name  "etf-daily-bot"
          git config user.email "etf-daily-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 日报 $(TZ=Asia/Shanghai date +%F) $(TZ=Asia/Shanghai date +%H:%M) CST"
            git push
          fi
      # 生成失败时本步报错终止，docs/index.html 保持上一版 → Pages 继续显示上一份可用报告



